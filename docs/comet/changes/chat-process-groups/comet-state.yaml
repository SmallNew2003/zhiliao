acceptance:
  - id: A1
    source: brief.md
    text: 在一个已完成轮次中渲染“执行组、Assistant 正文、执行组、Assistant
      正文、最终回答”时，会话顺序与日志一致；两段正文保持可见，两个执行组各自可展开，已完成组默认收起。
    result: passed
    reason:
      text: 执行组、正文和最终回答顺序正确，完成组默认收起且可独立展开。
      truncated: false
  - id: A2
    source: brief.md
    text: 在一个运行中的轮次中，当前执行组默认展开并显示运行状态与经过时间；上一条正文出现后，前一个执行组默认收起，组内最新过程仍可辨认。
    result: passed
    reason:
      text: 运行组默认展开并显示当前活动与 elapsed，后续正文出现时前一组关闭并默认收起。
      truncated: false
  - id: A3
    source: specs/chat-process-groups/spec.md
    text: Assistant 正文分隔执行组 - **WHEN** 一个轮次包含“过程内容、可见 Assistant 正文、过程内容、可见 Assistant
      正文、最终回答” - **THEN** 两段可见正文都留在执行组之外并保持原顺序 - **AND** 每段连续过程内容分别形成一个执行组 -
      **AND** 首个正文之前的独立过程内容也可以形成执行组
    result: passed
    reason:
      text: 连续过程按正文和轮次边界形成独立执行组，首个正文前过程也可成组。
      truncated: false
  - id: A4
    source: specs/chat-process-groups/spec.md
    text: 单个 Assistant Node 按内容分拆 - **WHEN** 一个 Assistant Node 同时包含非空推理块和可见回复块 -
      **THEN** 推理块进入所在执行组 - **AND** 可见回复块留在执行组之外 - **AND** 同一内容块不会重复渲染
    result: passed
    reason:
      text: 同一 Assistant Node 的 reasoning 与 response seat 正确分离，无重复渲染。
      truncated: false
  - id: A5
    source: specs/chat-process-groups/spec.md
    text: 独立行不进入执行组 - **WHEN** 轮次中出现用户消息、steering、系统提示词、错误、最大 token 提示或轮次尾部 -
      **THEN** 该行保持独立并按原顺序渲染 - **AND** 它成为相邻执行组之间的边界
    result: passed
    reason:
      text: 用户、steering、系统提示词、错误、最大 token 与 turn-tail 均保持独立并成为边界。
      truncated: false
  - id: A6
    source: specs/chat-process-groups/spec.md
    text: 运行中的组默认展开 - **WHEN** 执行组仍处于运行中 - **THEN** 组默认展开 - **AND**
      标题显示当前活动状态和该轮已经过时间 - **AND** 进行中的思考或工具行显示运行状态
    result: passed
    reason:
      text: 运行组显示本地化活动与轮次耗时，组内运行状态保持可见。
      truncated: false
  - id: A7
    source: specs/chat-process-groups/spec.md
    text: 已完成组显示摘要并默认收起 - **WHEN** 后续可见 Assistant 正文出现或轮次结束关闭执行组 - **THEN** 组默认收起 -
      **AND** 仅含思考的组显示“分析请求” - **AND** 含工具调用的组根据组内实际动作生成简短摘要 - **AND**
      存在失败调用时追加“部分操作失败”
    result: passed
    reason:
      text: 完成组默认收起；仅有思考时显示分析请求，失败时追加部分操作失败；call=null 的历史截断工具仍归类为调用工具并保留失败状态。
      truncated: false
  - id: A8
    source: specs/chat-process-groups/spec.md
    text: 完成摘要只描述动作类型 - **WHEN** 一个已完成执行组包含一种或多种工具动作 - **THEN**
      组标题最多描述两类主要动作，例如“读取文件、运行命令” - **AND** 标题不显示任何调用次数 - **AND**
      动作类型以执行组内去重后的工具调用归类 - **AND** 存在超过两类动作时在描述后追加“等操作”
    result: passed
    reason:
      text: 工具动作按 callId 去重并按类型聚合，标题最多展示两类、不显示次数，超过两类追加等操作。
      truncated: false
  - id: A9
    source: specs/chat-process-groups/spec.md
    text: 展开组限高并内部滚动 - **WHEN** 用户展开一个执行组 - **THEN** 组内过程区域最大高度为 `min(400px, 50vh)`
      - **AND** 内容超出高度时在执行组内部滚动 - **AND** 可继续向上或向下滚动时对应边缘显示渐隐提示
    result: passed
    reason:
      text: 展开组正文限高 min(400px, 50vh)、内部滚动并显示上下边缘渐隐。
      truncated: false
  - id: A10
    source: specs/chat-process-groups/spec.md
    text: 组内过程保持紧凑且可独立展开 - **WHEN** 执行组展开并包含多条思考或工具行 - **THEN** 每行保持现有紧凑摘要形态 -
      **AND** 已完成、失败和进行中状态可区分 - **AND** 思考行和工具行仍可各自展开详情
    result: passed
    reason:
      text: 组内保留现有推理、工具和重试行渲染器及其独立折叠与状态。
      truncated: false
  - id: A11
    source: specs/chat-process-groups/spec.md
    text: 组标题支持键盘和指针操作 - **WHEN** 用户点击执行组标题或聚焦后按 Enter 或 Space - **THEN** 执行组切换展开状态
      - **AND** 标题暴露 `aria-expanded` - **AND** 展开前的焦点停留在标题上
    result: passed
    reason:
      text: 标题按钮支持指针与 Enter/Space，暴露 aria-expanded/aria-controls 并保护焦点。
      truncated: false
  - id: A12
    source: specs/chat-process-groups/spec.md
    text: 页内查找揭示隐藏过程 - **WHEN** 浏览器页内查找命中已收起执行组内的文字 - **THEN** 对应执行组自动展开并显示命中内容
    result: passed
    reason:
      text: hidden=until-found 与 beforematch 揭示机制有效。
      truncated: false
  - id: A13
    source: specs/chat-process-groups/spec.md
    text: Compact 使用执行组 - **WHEN** 会话展示设置为 `Compact` - **THEN** 符合条件的连续过程内容使用执行组 -
      **AND** 运行中组展开、已完成组收起
    result: passed
    reason:
      text: Compact 使用执行组布局，运行组展开、完成组收起。
      truncated: false
  - id: A14
    source: specs/chat-process-groups/spec.md
    text: Normal 保持平铺 - **WHEN** 会话展示设置为 `Normal` - **THEN** 过程行按现有平铺方式显示 - **AND**
      不显示执行组标题或组级限高
    result: passed
    reason:
      text: Normal 保持原始平铺，不显示组标题或组级限高。
      truncated: false
  - id: A15
    source: specs/chat-process-groups/spec.md
    text: 流式追加与历史分页保持顺序 - **WHEN** 执行组内容流式增长、轮次完成或历史分页改变已加载窗口 - **THEN** 既有成员保持稳定
      key 和相对顺序 - **AND** 用户手动展开状态仅在对应组仍存在时保留 - **AND** 不因重新渲染改变工具或思考节点已选择的状态
    result: passed
    reason:
      text: 组 key 与成员 seat 在流式、完成和历史分页中保持稳定，手动展开状态可保留。
      truncated: false
  - id: A16
    source: specs/chat-process-groups/spec.md
    text: 执行组文案来自本地化字典 - **WHEN** 执行组显示运行状态、完成摘要或失败状态 - **THEN** 文案来自 `ui-chat`
      的本地化字典 - **AND** 中文与英文均覆盖全部新增键
    result: passed
    reason:
      text: 动作摘要、等操作、失败状态及运行文案均由 ui-chat zh/en locale 提供。
      truncated: false
  - id: A17
    source: specs/chat-process-groups/spec.md
    text: 运行状态不依赖颜色单独表达 - **WHEN** 执行组或组内行处于运行中 - **THEN** 同时提供文本或状态语义 - **AND** 动画在
      `prefers-reduced-motion` 下停止
    result: passed
    reason:
      text: 运行状态有文本语义，并在 prefers-reduced-motion 下停止动画与 transition。
      truncated: false
