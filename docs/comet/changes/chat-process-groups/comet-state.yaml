acceptance:
  - id: A1
    source: brief.md
    text: 在一个已完成轮次中渲染“执行组、Assistant 正文、执行组、Assistant
      正文、最终回答”时，会话顺序与日志一致；两段正文保持可见，两个执行组各自可展开，已完成组默认收起。
    result: passed
    reason:
      text: 已完成轮次按日志顺序投影为正文、执行组和最终回答；两个正文保持独立可见，两个完成组默认收起且标题按钮可展开。
      truncated: false
  - id: A2
    source: brief.md
    text: 在一个运行中的轮次中，当前执行组默认展开并显示运行状态与经过时间；上一条正文出现后，前一个执行组默认收起，组内最新过程仍可辨认。
    result: passed
    reason:
      text: 当前运行组默认展开并按轮次 startTime 显示本地化状态与经过时间；可见正文出现后执行组由 running 转为
        closed，默认折叠。增量场景确认新运行组不会覆盖前一个完成组。
      truncated: false
  - id: A3
    source: specs/chat-process-groups/spec.md
    text: Assistant 正文分隔执行组 - **WHEN** 一个轮次包含“过程内容、可见 Assistant 正文、过程内容、可见 Assistant
      正文、最终回答” - **THEN** 两段可见正文都留在执行组之外并保持原顺序 - **AND** 每段连续过程内容分别形成一个执行组 -
      **AND** 首个正文之前的独立过程内容也可以形成执行组
    result: passed
    reason:
      text: projectProcessGroups 在可见 Assistant 正文前 flush 当前过程段，正文作为独立 seat
        输出，后续过程重新建组；首个正文前的过程也能成组，顺序与输入日志一致。
      truncated: false
  - id: A4
    source: specs/chat-process-groups/spec.md
    text: 单个 Assistant Node 按内容分拆 - **WHEN** 一个 Assistant Node 同时包含非空推理块和可见回复块 -
      **THEN** 推理块进入所在执行组 - **AND** 可见回复块留在执行组之外 - **AND** 同一内容块不会重复渲染
    result: passed
    reason:
      text: 同一 Assistant Node 的 reasoning 块只进入组的 reasoning part，非 reasoning 块只进入
        response seat；ChatNodeSeat 按 part 过滤块，未发现同一内容被重复渲染。
      truncated: false
  - id: A5
    source: specs/chat-process-groups/spec.md
    text: 独立行不进入执行组 - **WHEN** 轮次中出现用户消息、steering、系统提示词、错误、最大 token 提示或轮次尾部 -
      **THEN** 该行保持独立并按原顺序渲染 - **AND** 它成为相邻执行组之间的边界
    result: passed
    reason:
      text: System prompt、User、steering、错误、最大 token 提示和 turn-tail
        均属于独立边界，会关闭当前组并保持自身顺序；Context 等连续过程内容仍进入组内。
      truncated: false
  - id: A6
    source: specs/chat-process-groups/spec.md
    text: 运行中的组默认展开 - **WHEN** 执行组仍处于运行中 - **THEN** 组默认展开 - **AND**
      标题显示当前活动状态和该轮已经过时间 - **AND** 进行中的思考或工具行显示运行状态
    result: passed
    reason:
      text: 未完成组使用 running 标题，优先显示当前进行中的工具活动，否则显示思考状态；elapsed 使用该轮计时并按秒刷新。
      truncated: false
  - id: A7
    source: specs/chat-process-groups/spec.md
    text: 已完成组显示摘要并默认收起 - **WHEN** 后续可见 Assistant 正文出现或轮次结束关闭执行组 - **THEN** 组默认收起 -
      **AND** 仅含思考的组显示“已处理” - **AND** 含工具调用的组显示“执行工具 N 次” - **AND** 存在失败调用时追加“其中
      M 次失败” - **AND** 组标题使用执行组内去重后的工具调用计数
    result: passed
    reason:
      text: 后续正文或 turn/end 会关闭组；无工具时显示“已处理”，有工具时显示去重后的调用总数并追加失败数。组 key
        修复后完成态不会再被后一运行组覆盖。
      truncated: false
  - id: A8
    source: specs/chat-process-groups/spec.md
    text: 展开组限高并内部滚动 - **WHEN** 用户展开一个执行组 - **THEN** 组内过程区域最大高度为 `min(400px, 50vh)`
      - **AND** 内容超出高度时在执行组内部滚动 - **AND** 可继续向上或向下滚动时对应边缘显示渐隐提示
    result: passed
    reason:
      text: "展开区域 CSS 使用 max-height: min(400px, 50vh) 和 overflow-y: auto；滚动位置同步
        data-scroll-up/down，并映射为上下边缘渐隐。"
      truncated: false
  - id: A9
    source: specs/chat-process-groups/spec.md
    text: 组内过程保持紧凑且可独立展开 - **WHEN** 执行组展开并包含多条思考或工具行 - **THEN** 每行保持现有紧凑摘要形态 -
      **AND** 已完成、失败和进行中状态可区分 - **AND** 思考行和工具行仍可各自展开详情
    result: passed
    reason:
      text: 组内继续复用 ChatNodeSeat、ReasoningRow 和现有工具渲染器；每条成员独立
        key，原有完成、失败、运行状态及各自展开能力未被替换。
      truncated: false
  - id: A10
    source: specs/chat-process-groups/spec.md
    text: 组标题支持键盘和指针操作 - **WHEN** 用户点击执行组标题或聚焦后按 Enter 或 Space - **THEN** 执行组切换展开状态
      - **AND** 标题暴露 `aria-expanded` - **AND** 展开前的焦点停留在标题上
    result: passed
    reason:
      text: 组标题是原生 button，Enter/Space 可触发点击；aria-expanded 随状态更新，点击时显式保持标题焦点。
      truncated: false
  - id: A11
    source: specs/chat-process-groups/spec.md
    text: 页内查找揭示隐藏过程 - **WHEN** 浏览器页内查找命中已收起执行组内的文字 - **THEN** 对应执行组自动展开并显示命中内容
    result: passed
    reason:
      text: 组正文使用 hidden='until-found'，监听 beforematch 后设为展开并持久化显式展开选择；组件测试确认命中后状态同步变化。
      truncated: false
  - id: A12
    source: specs/chat-process-groups/spec.md
    text: Compact 使用执行组 - **WHEN** 会话展示设置为 `Compact` - **THEN** 符合条件的连续过程内容使用执行组 -
      **AND** 运行中组展开、已完成组收起
    result: passed
    reason:
      text: Compact 分支从 snapshot.processGroups.layout
        渲染，运行组默认展开、完成组默认收起；切换时组标题和分组布局重新出现。
      truncated: false
  - id: A13
    source: specs/chat-process-groups/spec.md
    text: Normal 保持平铺 - **WHEN** 会话展示设置为 `Normal` - **THEN** 过程行按现有平铺方式显示 - **AND**
      不显示执行组标题或组级限高
    result: passed
    reason:
      text: Normal 分支继续按原始 order 平铺 ChatNodeSeat，不渲染 ProcessGroupSeat，因此无组标题和组级限高。
      truncated: false
  - id: A14
    source: specs/chat-process-groups/spec.md
    text: 流式追加与历史分页保持顺序 - **WHEN** 执行组内容流式增长、轮次完成或历史分页改变已加载窗口 - **THEN** 既有成员保持稳定
      key 和相对顺序 - **AND** 用户手动展开状态仅在对应组仍存在时保留 - **AND** 不因重新渲染改变工具或思考节点已选择的状态
    result: passed
    reason:
      text: 组 key 由首成员稳定 nodeKey/part 生成，并以旧组成员包含关系复用；回归测试和额外只读场景确认完成组与后续运行组得到两个不同
        key，折叠不卸载 renderer。
      truncated: false
  - id: A15
    source: specs/chat-process-groups/spec.md
    text: 执行组文案来自本地化字典 - **WHEN** 执行组显示运行状态、完成摘要、工具计数或失败计数 - **THEN** 文案来自 `ui-chat`
      的本地化字典 - **AND** 中文与英文均覆盖全部新增键
    result: passed
    reason:
      text: 运行状态、完成摘要、工具计数和失败计数均通过 ui-chat 的 t 字典输出；zh 与 en 覆盖全部 activity 和标题键。
      truncated: false
  - id: A16
    source: specs/chat-process-groups/spec.md
    text: 运行状态不依赖颜色单独表达 - **WHEN** 执行组或组内行处于运行中 - **THEN** 同时提供文本或状态语义 - **AND** 动画在
      `prefers-reduced-motion` 下停止
    result: passed
    reason:
      text: "运行状态同时由标题文本表达，不只依赖颜色；running 动画及 chevron transition 在
        prefers-reduced-motion: reduce 下均被禁用。"
      truncated: false
