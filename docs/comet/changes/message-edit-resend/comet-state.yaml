acceptance:
  - id: A1
    source: specs/message-edit-resend/spec.md
    text: Only the latest user message is editable The chat contains input A,
      response A, input B, and response B. Users can edit B; A has no direct
      edit action. Response B does not change B's status as the latest user
      message.
    result: passed
    reason:
      text: 界面按有效聊天中的 latestInputSeq 只为最新已发送用户输入提供编辑；服务端再次校验最新目标。当前真实中文流程在 A/B
        均已得到回答后仅发现一个编辑按钮，170 项行为检查和 Web 回放共同覆盖该规则。
      truncated: false
  - id: A2
    source: specs/message-edit-resend/spec.md
    text: The first user message is editable The chat contains only sent user
      message A and its response. Users can edit A. Resending excludes original
      A and its response and does not reject the edit merely because there is no
      earlier user input.
    result: passed
    reason:
      text: 核心折叠允许从第一个用户输入前的空历史恢复，不要求存在更早输入；首次输入编辑的核心/API 测试及两种 SDK
        回放通过。真实流程中单输入停止后的重发和只继承 A 的分支编辑均得到新回答。
      truncated: false
  - id: A3
    source: specs/message-edit-resend/spec.md
    text: Cancelling an edit Users modify the latest message and cancel. The chat
      restores the original input and response without a new model request or
      tool execution.
    result: passed
    reason:
      text: 编辑草稿保存在组件中，取消不调用 editMessage；中英文组件检查确认原文预填、Escape
        取消、无请求及焦点恢复。真实中文流程取消草稿后原回答仍在，未产生 user/message-edit 事件。
      truncated: false
  - id: A4
    source: specs/message-edit-resend/spec.md
    text: Resending excludes original input and response The chat contains A and its
      response, then B and its response. Users modify B to B2 and submit. The
      current chat displays A and its response, followed by B2 and a new
      response. Model history contains A and its response and B2, excluding
      original B and response B.
    result: passed
    reason:
      text: user/message-edit 恢复目标原始输入之前的有效历史并追加修改输入，原日志不被改写；API 测试直接核对模型请求为
        A/回答A/B2。真实中文流程核对界面及 deriveMessages 同时排除原 B 和原回答，保留 A 与新 B2/回答。
      truncated: false
  - id: A5
    source: specs/message-edit-resend/spec.md
    text: Persistence recovery after resending After the modified latest message and
      new response are saved, users reload the chat or restart the server.
      Display and effective model history retain modified input and the new
      response. The log retains replayable original events and the edit record.
    result: passed
    reason:
      text: 核心回放从保留的原事件和编辑/文字接纳事件重建相同有效历史，SDK JSONL 回放和 Python 最新可执行包检查通过。真实 Web
        刷新后继续显示修改输入与新回答，原 B 不再显示；本轮没有额外声称执行服务端重启。
      truncated: false
  - id: A6
    source: specs/message-edit-resend/spec.md
    text: A draft target is no longer latest A client starts editing B, but the chat
      accepts newer user message C before submission. The server rejects editing
      B. The client preserves the draft and explains that its target is no
      longer latest. The edit makes no model request and does not affect C.
    result: passed
    reason:
      text: 服务端在观察、维护预留及提交前校验最新用户序号，并拒绝旧目标与新待处理输入；API
        检查确认无编辑事件、无额外模型请求。界面保留原草稿并显示本地化过期说明，新 C 不受该编辑影响。
      truncated: false
  - id: A7
    source: specs/message-edit-resend/spec.md
    text: Another client edits the same message first Two clients edit latest
      message B. One successfully submits B2 first. The other submission based
      on original B is rejected. Its draft remains recoverable, does not
      overwrite B2, and makes no extra model request.
    result: passed
    reason:
      text: 维护预留阻止重叠编辑，首次接受后原目标已过期；不同请求标识不能覆盖先接受的 B2。API 并发/旧目标检查及 ChatView
        草稿脱离旧行后的保留检查通过，第二个草稿仍可恢复且不会创建额外回答。
      truncated: false
  - id: A8
    source: specs/message-edit-resend/spec.md
    text: Editing is disabled during an active run The latest message is awaiting a
      model response or running a tool. The edit action is unavailable and gives
      a localized reason. Users cannot interrupt the run through this action.
    result: passed
    reason:
      text: 编辑按钮在真实模型运行时带
        aria-disabled，提供中文禁用原因；组件同时阻止点击，服务端拒绝非空闲或有待处理输入的编辑。当前真实中文运行流程及
        Web/组件/API 检查通过，编辑操作不调用停止接口。
      truncated: false
  - id: A9
    source: specs/message-edit-resend/spec.md
    text: Editing after manual stop Users manually stop a run. Editing remains
      unavailable until stopping and tool cleanup finish. After the server
      confirms the run ended, the latest user message becomes eligible again.
    result: passed
    reason:
      text: API 清理屏障测试在工具清理完成前拒绝编辑，确认 idle 后才允许重发；真实中文流程记录 aborted turn/end 后恢复编辑并得到
        AFTER_STOP_EDIT_OK。取消修复复制可枚举原因字段，永久回归覆盖传输附加不可枚举 stack，未放松 Session 无损
        JSON 校验；448 项循环/API 检查通过。
      truncated: false
  - id: A10
    source: specs/message-edit-resend/spec.md
    text: A run starts while editing The editor is open when the chat starts
      running. The client disables submission and preserves the draft. A direct
      server edit request is also rejected; the existing run is not
      automatically stopped.
    result: passed
    reason:
      text: 编辑器随 running 更新禁用提交且保留草稿，submit
        内部也拒绝运行时调用；服务端独立检查运行/待输入状态并在接纳前复核。组件状态切换、活动模型请求及工具停止清理检查通过，已有运行不会被编辑自动停止。
      truncated: false
  - id: A11
    source: specs/message-edit-resend/spec.md
    text: Text changes preserve attachments The latest user message contains text
      and multiple attachments. After text changes are submitted, the modified
      message and model request retain original attachment identities, order,
      and content. The UI offers no attachment addition or removal and performs
      no repeated upload.
    result: passed
    reason:
      text: 服务端仅替换文本块，逐一读取原图片/文件以验证可用性，保留非文本引用的身份和顺序；编辑请求没有附件增删或上传字段。真实流程保留
        first.txt/second.txt 两个原始 SHA-256 标识和顺序，API 直接核对模型请求中的原附件。
      truncated: false
  - id: A12
    source: specs/message-edit-resend/spec.md
    text: Attachment-only input remains valid Users clear the text while valid
      original attachments remain. Resending preserves them and accepts the
      input under existing attachment-input rules. Blank input with neither text
      nor attachments is rejected, preserving the draft and original
      conversation.
    result: passed
    reason:
      text: 文本清空时服务端允许保留原有效附件的输入；无文本且无附件则在接纳前拒绝。API 覆盖附件-only
        模型请求，组件覆盖空输入错误、草稿保留及不调用接口；原会话不会因无效空输入改变。
      truncated: false
  - id: A13
    source: specs/message-edit-resend/spec.md
    text: An original attachment cannot be read An original attachment required for
      resending is unavailable. The system explains the failure, does not
      silently drop attachments or request the model with partial input, and
      preserves a recoverable text draft.
    result: passed
    reason:
      text: 所有原附件在编辑事件提交前读取并验证，图片不存在或文件流完整性失败返回 session/attachment-invalid；API
        检查确认原输入/附件保留且无新模型请求。组件将该错误本地化并保留可重试文本草稿，不会静默丢弃附件。
      truncated: false
  - id: A14
    source: specs/message-edit-resend/spec.md
    text: Submitted content is unchanged Users open the editor without changing
      text, or restore the original text. The UI makes no resend request and
      does not call the model or tools again.
    result: passed
    reason:
      text: 组件比较草稿与打开编辑器时的原文，无变化直接关闭并恢复焦点，不发送重发请求；服务端相同文字也返回接受但不追加编辑事件。中英文组件及 API
        检查确认模型请求和工具不会因无变化重复执行。
      truncated: false
  - id: A15
    source: specs/message-edit-resend/spec.md
    text: Failure before acceptance Users submit valid text, but the operation fails
      before acceptance. Original input and response remain intact. The UI
      preserves the draft and allows retry. The failed operation made no model
      request.
    result: passed
    reason:
      text: 历史读取、输入、模型可用性或附件验证失败均发生在持久编辑提交之前；API
        检查确认原有效会话保持且无新增模型调用。网络/返回错误的组件检查保留草稿、显示本地化失败说明并允许重试。
      truncated: false
  - id: A16
    source: specs/message-edit-resend/spec.md
    text: Retrying after losing an acceptance response The server accepted
      resending, but the client did not receive its response. Retrying with the
      same request identifier returns the same acceptance. The edit input is
      recorded once and only one new response is started.
    result: passed
    reason:
      text: 草稿重试复用稳定
        requestId；服务端先查询已记录的接受，再判断旧目标/运行状态，并在重新观察后再次查询。丢失回复、目标已被替换及交叠旧观察的检查均通过，只保存一个编辑输入且只启动一个新回答。
      truncated: false
  - id: A17
    source: specs/message-edit-resend/spec.md
    text: Model failure after acceptance The edit request was accepted and the model
      subsequently fails. The chat still displays modified input and a failure
      state, and users can use existing recovery actions. Original input and
      response are not restored as current effective history.
    result: passed
    reason:
      text: 编辑先持久接受，再驱动回复；请求准备失败或 pre-step 拒绝时修改输入仍是当前有效历史，不会恢复原输入/回答。API 接受后失败检查及
        ChatView 既有终止错误/恢复展示检查通过；本轮没有向真实模型注入失败。
      truncated: false
  - id: A18
    source: specs/message-edit-resend/spec.md
    text: The latest inherited message is editable The parent chat contains A and
      its response, then B and its response. Users branch from the end of
      response A into a new chat containing A and its response. A is editable.
      Resending modified A2 gives the child A2 and a new response; the parent's
      A, B, and original responses remain intact.
    result: passed
    reason:
      text: 沿现有已完成轮次的分支动作进入子聊天后，其继承 A 是最新输入并可编辑。真实中文流程在子聊天重发得到
        BRANCH_EDIT_OK，父聊天原始事件前后完全一致；API 继承编辑与 Web 分支回放也通过。
      truncated: false
  - id: A19
    source: specs/message-edit-resend/spec.md
    text: External side effects are not rolled back The original response modified a
      file. Users edit and resend the latest message or adjust a message in a
      branch. Editing and branching do not undo that file change.
    result: passed
    reason:
      text: 历史折叠和分支只改变当前会话视图/模型历史，不执行文件或外部状态回滚。真实模型工具创建的 edit-proof.txt 在随后编辑 B 以及分支编辑
        A 后仍包含 EFFECT_KEEP，父会话保持完整。
      truncated: false
  - id: A20
    source: specs/message-edit-resend/spec.md
    text: Chinese and English keyboard operation Users use the keyboard to open the
      editor, change text, and cancel or resend in Chinese or English. Controls
      have names in the selected language. Disabled and error reasons are
      perceivable, and closing the editor does not lose focus.
    result: passed
    reason:
      text: 所有编辑按钮、文本框、取消、重发及错误/禁用理由来自中英文 typed locale 字典；使用原生按钮、可命名
        textarea、status/alert 和 Escape/Ctrl或Meta+Enter。中英文组件及 ChatView
        检查确认取消/提交后的焦点恢复，中文真实流程验证键盘取消和重发，英文由组件和 Web 回放补足。
      truncated: false
