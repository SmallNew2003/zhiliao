    source: brief.md
    text: DSH 通过项目 overlay 加载 `dsh-hooks-codex` 后，bridge 将原始工具参数提供给 Comet
      路由器；非写入调用继续执行，Native Build 阶段允许实现写入，Shape 阶段拒绝实现写入，Verify 阶段写入使候选失效并返回
      Build。
    result: passed
    reason:
      text: Overlay and phase policy match specification.
      truncated: false
  - id: A4
    source: brief.md
    text: 未启用工具参数传递的 DSH bridge 继续仅向 Codex hook 提供 `tool_input.command`。
    result: passed
    reason:
      text: Default payload remains command-only.
      truncated: false
  - id: A5
    source: brief.md
    text: Git 仅跟踪项目级 Comet 配置、适配层、DSH overlay 和正式文档工件，忽略本机运行时状态。
    result: passed
    reason:
      text: Runtime state is ignored.
      truncated: false
  - id: A6
    source: specs/comet-workflow-integration/spec.md
    text: 解析已提交的项目工作流 - **WHEN** 开发者在仓库根目录执行 Comet 工作流解析命令 - **THEN** 命令返回项目保存的有效配置
      - **AND** 返回的可用工作流包含 Native 和 Classic
    result: passed
    reason:
      text: Native and Classic are configured.
      truncated: false
  - id: A7
    source: specs/comet-workflow-integration/spec.md
    text: 客户端调用可移植路由器 - **WHEN** Codex 或 WorkBuddy 在仓库检出中调用已提交的写入钩子 - **THEN**
      钩子调用仓库内可解析的 Comet 路由器 - **AND** 该调用不包含特定开发者的绝对项目路径
    result: passed
    reason:
      text: Only selected adapters are present.
      truncated: false
  - id: A8
    source: specs/comet-workflow-integration/spec.md
    text: DSH 复用 Comet 写入约束 - **WHEN** DSH 使用项目的 Comet overlay 运行工具调用 - **THEN**
      `dsh-hooks-codex` 在 `PreToolUse` 时调用 Comet 路由器 - **AND** bridge
      将工具参数传递给路由器以识别文件操作目标 - **AND** 非写入调用继续执行 - **AND** Native Build
      阶段的实现写入继续执行 - **AND** Native Shape 阶段的实现写入被拒绝 - **AND** Native Verify
      阶段的实现写入使候选失效并返回 Build
    result: passed
    reason:
      text: DSH routing policy matches the corrected specification.
      truncated: false
  - id: A9
    source: specs/comet-workflow-integration/spec.md
    text: 未启用参数传递时保留现有 payload - **WHEN** `dsh-hooks-codex` 未启用工具参数传递 - **THEN** 每个
      Codex tool payload 的 `tool_input` 仅包含字符串 `command`
    result: passed
    reason:
      text: Default payload regression test passed.
      truncated: false
  - id: A10
    source: specs/comet-workflow-integration/spec.md
    text: Comet overlay 启用参数传递 - **WHEN** DSH 使用 Comet overlay 调用带文件路径的工具 - **THEN**
      Codex hook payload 保留该文件路径 - **AND** `tool_input.command` 仍为字符串
    result: passed
    reason:
      text: Opt-in payload regression test passed.
      truncated: false
  - id: A11
    source: specs/comet-workflow-integration/spec.md
    text: 干净检出不含本机状态 - **WHEN** 开发者在另一台机器检出该仓库 - **THEN** 所有已跟踪的 Comet 配置和适配文件可用 -
      **AND** 本机运行时状态不在 Git 跟踪中
    result: passed
    reason:
      text: Clean-clone state policy is correct.
      truncated: false
