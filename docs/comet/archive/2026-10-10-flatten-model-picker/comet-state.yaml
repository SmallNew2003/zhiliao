acceptance:
  - id: A1
    source: brief.md
    text: In a session that permits model selection, one click opens
      provider-grouped models and marks the current model without an
      intermediate Model submenu.
    result: passed
    reason:
      text: ModelSelect 直接渲染目录顺序的 provider group 与 menuitemradio，不存在中间 Model 子菜单；当前模型的
        aria-checked 和勾选标记由共享目录 current 派生。组件测试、两份更新的 ARIA 快照及实际页面截图相符。
      truncated: false
  - id: A2
    source: brief.md
    text: When the current model supports reasoning, the same panel shows exactly
      its provider-declared efforts and current value. Models without reasoning
      omit this section; arbitrary efforts are not introduced and provider
      default semantics remain intact.
    result: passed
    reason:
      text: 同一面板下方仅从当前模型 reasoning.efforts 构造选项；无 reasoning 元数据时省略等级区，未配置
        defaultEffort 时保留 Default。组件测试覆盖有默认值、无默认值和缺失目录项；declared-reasoning
        浏览器回归验证仅提供声明等级并持久化 high。
      truncated: false
  - id: A3
    source: brief.md
    text: Successful model or effort selection updates the trigger from the
      Host-confirmed result, closes the panel, and restores trigger focus.
      Selecting the current value closes without another write. Existing
      persistence scope and subsequent-request semantics remain unchanged.
    result: passed
    reason:
      text: 模型与等级选择继续调用原 ModelDirectory/Host API，current
        仍读取持久化投影而非乐观改写；成功后关闭并恢复触发器焦点，选中当前值直接关闭且不写入。组件测试覆盖上述关闭/焦点/无重复写入，default-model
        浏览器回归保留后续会话默认值与已有日志会话的独立语义；实际 Session 记录模型/等级变更及后续请求配置。
      truncated: false
  - id: A4
    source: brief.md
    text: Arrow keys move among actionable options; Enter, Space, or the existing
      Tab gesture selects. Escape or Shift+Tab closes in one step and restores
      trigger focus; outside clicks also close. A pending selection prevents
      duplicate submissions.
    result: passed
    reason:
      text: 方向键遍历并环绕未禁用选项，Tab 激活当前按钮，Escape 与 Shift+Tab 单步关闭并恢复焦点；Enter/Space 保留原生
        button 激活语义。组件测试覆盖焦点遍历、Tab、两种关闭、真正外部点击及 selecting
        禁用；浏览器回归验证跨模型/等级导航与关闭焦点。
      truncated: false
  - id: A5
    source: brief.md
    text: Loading, retryable catalog errors, partial provider failures, empty lists,
      and rejected selections have explicit feedback. Rejected selections retain
      the original value and remain retryable.
    result: passed
    reason:
      text: 加载、目录错误 Retry、部分 provider 失败和空列表直接在面板显示；选择失败使用既有 Toast，原目录 current
        不因失败改写，selecting 结束后可重新选择。组件与 catalog 测试覆盖对应反馈、保留旧目录、失败重试及 writer-held
        指引；未引入目录缺失即不可路由的判断。
      truncated: false
  - id: A6
    source: brief.md
    text: In Chinese and English, light and dark themes, desktop and 390px
      viewports, the panel stays within the viewport; long names and many
      options remain readable or scrollable, and the effort section is visually
      distinct from the model list.
    result: passed
    reason:
      text: Runtime 的 declared-reasoning 回归实际执行中/英 × 明/暗 × 1280/390px
        八组长名称与17项模型布局，断言四边在视口内、无横向溢出且最末等级可滚动到达。独立目视检查中文明色、英文深色及390px深色截图，等级标题与分隔线清晰，模型名称受限宽度显示。
      truncated: false
  - id: A7
    source: brief.md
    text: Provide the current worktree’s real Web UI and a date-stamped interaction
      GIF showing the list, model selection, and effort selection when
      supported. Update and validate relevant component tests, browser
      regressions, and owner-local snapshots, and complete independent read-only
      acceptance.
    result: passed
    reason:
      text: 核对当前 worktree、HEAD、TSX/CSS 与日期戳 GIF 的 SHA256
        均匹配证据记录；目视检查模型列表、切换模型、切换等级及真实回复截图。隔离 Session 中存在 model/selection、实际
        request/header（deepseek-flash/off）、目标 assistant/message 与 completed
        回合。候选绑定 Runtime
        回执证实3文件40组件/目录测试、7文件33浏览器测试、Host/Client类型检查、lint、3双语配对和空白检查通过；两份
        owner-local ARIA 快照已更新。本报告完成独立只读逐项验收。
      truncated: false
