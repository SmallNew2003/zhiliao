- insert:
    - id: mcp-toolbox
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: toolbox
        command: !!js process.execPath
        args: !!js '[process.env.DSH_MCP_DISCOVERY_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false
