name: CI

on:
  pull_request:
permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

# Cancel a superseded pull-request run on a new push so a fresh head does not
# queue a second run behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Static analysis runs without a build: workspace imports resolve to src
  # through the tsconfig paths map. The build-backed gates live in
  # node-24-consumers, which owns the only Linux build, so both jobs enter
  # runner allocation independently.
  node-24:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / static
    env:
      # Sized for the standard runner's CPU count. Removing the override lets
      # run-gates fall back to min(gate count, available CPUs).
      DSH_GATE_CONCURRENCY: '4'
      # Stop the aggregate at the first blocking gate failure so a red run
      # does not keep burning runner time on the remaining gates.
      DSH_GATE_FAIL_FAST: '1'
    steps:
      # Runner cleanup owns tool caches and fixtures, including cancelled runs.
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      # Fetch complete history so the archive gate can read the trusted PR base from a reused shallow checkout.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Redirect the Node compile cache (enabled by pnpm and TypeScript) off
      # the root partition's /tmp before the first pnpm call in this lane.
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Pull requests consume the default-branch cache but do not put cache
      # compression and upload on the latency-critical path.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:static

  node-24-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / coverage
    env:
      # Partitioning replaces the instrumented share: each partition is one
      # single-worker Vitest process, so wall clock does not improve by adding
      # cores inside a partition. Two partitions measured 1831s on a 12-core
      # host; raise the count to shorten the lane at the cost of memory
      # pressure, since four instrumented processes share the runner's RAM.
      DSH_COVERAGE_PARTITIONS: '2'
      DSH_GATE_CONCURRENCY: '2'
      # Managed-scope teardown cases run past the default per-test budget when
      # the partitions, workers, and sibling gates share one host: the disposal
      # cases in subprocess-local and bash-sandbox exceeded 5000ms on the
      # standard image.
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
      # A gate failure aborts the sibling gate instead of waiting out its
      # multi-minute instrumented run.
      DSH_GATE_FAIL_FAST: '1'
    steps:
      # Runner cleanup owns tool caches and fixtures, including cancelled runs.
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Restore coverage duration history
        uses: actions/cache/restore@v6.1.0
        with:
          path: .coverage-times.json
          key: coverage-times-Linux-${{ runner.environment }}-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coverage-times-Linux-${{ runner.environment }}-hosted-

      # Redirect the Node compile cache (enabled by pnpm and TypeScript) off
      # the root partition's /tmp before the first pnpm call in this lane.
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Run exhaustive coverage
        run: pnpm run check:ci:coverage

      - name: Save coverage duration history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .coverage-times.json
          key: coverage-times-Linux-${{ runner.environment }}-hosted-${{ github.run_id }}-${{ github.run_attempt }}

  # Lint and duplication get their own lane instead of riding the artifact
  # consumers: a red lint no longer costs the snapshot and artifact consumers a
  # full rerun. The lane compiles package declarations because oxlint's
  # type-aware rules read them.
  node-24-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / lint
    env:
      # Sized for the standard runner's CPU count.
      DSH_GATE_CONCURRENCY: '4'
    steps:
      # Runner cleanup owns tool caches and fixtures, including cancelled runs.
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # oxlint's type-aware rules resolve workspace imports through the package
      # declarations, so this lane compiles them without bundling anything.
      - name: Compile package declarations
        run: pnpm run typecheck

      - name: Run lint and duplication
        run: pnpm run check:ci:lint:contracts-ready

  node-24-bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / benchmarks
    # Wall-clock budgets need an otherwise idle runner, so this job runs the
    # benchmark lane alone instead of joining a concurrent gate aggregate, and
    # keeps its own two-file parallelism inside that runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install benchmark browser and hosted dependencies
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        env:
          DSH_GATE_VERBOSE: '1'
        run: pnpm run check:ci:bench

      # The report global teardown renders benchmarks/.dsh-report after the run,
      # including after a failing budget assertion. A run that fails before
      # recording any timing has no report, so missing files warn instead of
      # failing the benchmark job a second time.
      - name: Upload scaled benchmark report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-report
          path: benchmarks/.dsh-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  node-24-consumers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: node 24 / snapshots and artifacts
    env:
      # ci-consumers defaults to one worker per gate, which oversubscribes the
      # standard runner's CPU count: the build gate alone drives tsc. Cap it.
      DSH_GATE_CONCURRENCY: '3'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      # Every browser lane needs at least two workers; two keeps a Chromium
      # instance per remaining core.
      DSH_WEB_SNAPSHOT_WORKERS: '2'
      # A failing gate aborts its running siblings: a failing build stops the
      # independent Node compatibility smoke, and a failing reader (e.g.
      # publint) stops the remaining artifact consumers.
      DSH_GATE_FAIL_FAST: '1'
    steps:
      # Runner cleanup owns tool caches and fixtures, including cancelled runs.
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP%/*}/ms-playwright" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Redirect the Node compile cache (enabled by pnpm and TypeScript) off
      # the root partition's /tmp before the first pnpm call in this lane.
      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Pull requests restore the pnpm store and Playwright caches without paying
      # compression and upload on the required path.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      # Ephemeral runner images can carry Ubuntu mirrors whose HTTP endpoints are unreachable.
      - name: Install Playwright Chromium, WebKit, and hosted dependencies
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E 's@http://([a-z]{2}\.)?archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g; s@http://security\.ubuntu\.com/ubuntu@https://security.ubuntu.com/ubuntu@g' {} +
          pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit

      - name: Build and execute the Linux Office runtime
        run: CI=true pnpm run prepare:primary-runtime --target linux-x64 --output "$RUNNER_TEMP/office-runtime" --cache "$RUNNER_TEMP/office-runtime-downloads"

      - name: Run compatibility, snapshot, and artifact gates
        run: pnpm run check:ci:consumers


  node-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    env:
      DSH_GATE_CONCURRENCY: ${{ matrix.gate_concurrency }}
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
      # A failed smoke aborts the remaining compatibility gates instead of
      # letting the build-backed legs run against an already-red aggregate.
      DSH_GATE_FAIL_FAST: '1'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Pin the supported floor, whose internal loader is v1. Primary
          # jobs track latest 24 and exercise v2, introduced in 24.12.0.
          - node: '24.9'
            name: node 24.9
            runner: ubuntu-latest
            gate_concurrency: '1'
          - node: 26
            name: node 26
            runner: ubuntu-latest
            gate_concurrency: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          package-manager-cache: false

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run compatibility smokes
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run check:node-compat

      # Kept out of the gate aggregate: the shape a Node release carries only
      # changes with the Node version, so this belongs to the version matrix
      # rather than to every commit's checks.
      - name: Check Loader internal shape detection
        run: pnpm exec vitest run packages/boot/app-boot/tests/loader-shape.compat.spec.ts

  # Single stable required check for branch protection: require "all checks
  # passed" instead of enumerating matrix legs whose names change as lanes and
  # node versions evolve. Every blocking job in THIS workflow must be listed in
  # `needs`. `needs` cannot cross workflow files: native Windows jobs report
  # the separate "windows checks passed" verdict from ci-windows.yml, Python
  # jobs report "python checks passed" from ci-python.yml, and Wine plus the
  # master-only runtime targets live in ci-master.yml.
  # An explicit status function runs the verdict after failed/skipped needs
  # without keeping a cancelled workflow alive for an obsolete verdict.
  all-checks-passed:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [node-24, node-24-coverage, node-24-lint, node-24-bench, node-24-consumers, node-compat]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
