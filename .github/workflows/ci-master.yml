name: CI master

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: Manual CI suite to run
        required: true
        default: serial-macos
        type: choice
        options:
          - serial-macos
          - python-runtime

# New master pushes and manual runs replace obsolete checks in this workflow/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Release-shaped executable and installed-wheel validation. Manual dispatch
  # only: the reusable builder's real-API preflight fails loud when
  # DEEPSEEK_API_KEY_EXTERNAL is unset rather than reporting a false green, so
  # this lane stays red until that secret exists. Set the secret, then dispatch
  # `gh workflow run ci-master.yml -f suite=python-runtime`.
  python-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'python-runtime'
    name: python runtime / macOS and Linux ARM64
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-arm64,node24-macos-arm64,node24-macos-x64
      ci: true
    secrets:
      DEEPSEEK_API_KEY_EXTERNAL: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}

  # Unsharded serial reference for the complete primary Node aggregate. Manual
  # dispatch only: the PR lanes in ci.yml cover every commit, and this lane
  # exists to prove the aggregate still passes without partitioning when a
  # coverage lane fails in a way the sharded runs cannot explain.
  serial-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'serial-macos'
    name: serial / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run complete unsharded primary Node CI serially
        env:
          DSH_COVERAGE_MAX_WORKERS: '1'
          DSH_E2E_MAX_WORKERS: '1'
          DSH_GATE_CONCURRENCY: '1'
          DSH_PUBLINT_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
        run: pnpm run check:ci
